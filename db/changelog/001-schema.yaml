databaseChangeLog:
  - changeSet:
      id: 001-users-table
      author: rainer
      changes:
        - createTable:
            tableName: users
            columns:
              - column:
                  name: id
                  type: BIGSERIAL
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: login
                  type: TEXT
                  constraints:
                    nullable: false
                    unique: true
              - column:
                  name: email
                  type: TEXT
              - column:
                  name: status
                  type: TEXT
                  defaultValue: active
                  constraints:
                    nullable: false
              - column:
                  name: created_at
                  type: TIMESTAMP WITH TIME ZONE
                  defaultValueComputed: NOW()
                  constraints:
                    nullable: false

  - changeSet:
      id: 002-audit-log-table
      author: rainer
      changes:
        - createTable:
            tableName: audit_log
            columns:
              - column:
                  name: id
                  type: BIGSERIAL
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: actor
                  type: TEXT
                  constraints:
                    nullable: false
              - column:
                  name: action
                  type: TEXT
                  constraints:
                    nullable: false
              - column:
                  name: at
                  type: TIMESTAMP WITH TIME ZONE
                  defaultValueComputed: NOW()
                  constraints:
                    nullable: false

  - changeSet:
      id: 003-orders-table
      author: rainer
      changes:
        - createTable:
            tableName: orders
            columns:
              - column:
                  name: id
                  type: BIGSERIAL
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: user_id
                  type: BIGINT
                  constraints:
                    nullable: false
                    foreignKeyName: fk_orders_user
                    references: users(id)
              - column:
                  name: total_cents
                  type: INTEGER
                  constraints:
                    nullable: false
              - column:
                  name: items
                  type: JSONB
                  constraints:
                    nullable: false

  - changeSet:
      id: 004-flags-table
      author: rainer
      changes:
        - createTable:
            tableName: flags
            columns:
              - column:
                  name: name
                  type: TEXT
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: enabled
                  type: BOOLEAN
                  constraints:
                    nullable: false

  - changeSet:
      id: 005-daily-stats-table
      author: rainer
      changes:
        - createTable:
            tableName: daily_stats
            columns:
              - column:
                  name: day
                  type: DATE
                  constraints:
                    nullable: false
              - column:
                  name: region
                  type: TEXT
                  constraints:
                    nullable: false
              - column:
                  name: revenue
                  type: NUMERIC(12, 2)
                  constraints:
                    nullable: false
        - addPrimaryKey:
            tableName: daily_stats
            columnNames: day, region
            constraintName: pk_daily_stats

  - changeSet:
      id: 006-posts-table
      author: rainer
      changes:
        - sql:
            splitStatements: false
            sql: |
              CREATE TABLE posts (
                id BIGSERIAL PRIMARY KEY,
                title TEXT NOT NULL,
                categories TEXT[] NOT NULL DEFAULT '{}'
              );

  - changeSet:
      id: 007-array-targets-table
      author: rainer
      changes:
        - sql:
            splitStatements: false
            sql: |
              CREATE TABLE array_targets (
                id BIGSERIAL PRIMARY KEY,
                ints BIGINT[] NOT NULL DEFAULT '{}',
                floats DOUBLE PRECISION[] NOT NULL DEFAULT '{}',
                flags BOOLEAN[] NOT NULL DEFAULT '{}'
              );

  - changeSet:
      id: 008-semantic-array-targets-table
      author: rainer
      changes:
        - sql:
            splitStatements: false
            sql: |
              CREATE TABLE semantic_arrays (
                id BIGSERIAL PRIMARY KEY,
                uuids UUID[] NOT NULL DEFAULT '{}',
                dates DATE[] NOT NULL DEFAULT '{}',
                timestamps TIMESTAMPTZ[] NOT NULL DEFAULT '{}'
              );

  - changeSet:
      id: 009-decimal-jsonb-array-columns
      author: rainer
      changes:
        - sql:
            splitStatements: false
            sql: |
              CREATE TABLE decimal_arrays (
                id BIGSERIAL PRIMARY KEY,
                amounts NUMERIC(12,2)[] NOT NULL DEFAULT '{}'
              );
              CREATE TABLE jsonb_arrays (
                id BIGSERIAL PRIMARY KEY,
                docs JSONB[] NOT NULL DEFAULT '{}'
              );

  - changeSet:
      id: 010-enum-table
      author: rainer
      changes:
        - sql:
            splitStatements: false
            sql: |
              CREATE TYPE ticket_priority AS ENUM ('low', 'medium', 'high');
              CREATE TABLE tickets (
                id BIGSERIAL PRIMARY KEY,
                title TEXT NOT NULL,
                priority ticket_priority NOT NULL,
                tags ticket_priority[] NOT NULL DEFAULT '{}'
              );
