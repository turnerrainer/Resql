[graph]
targets = [
    { triple = "x86_64-unknown-linux-gnu" },
    { triple = "aarch64-unknown-linux-gnu" },
]
all-features = false
no-default-features = false

[advisories]
db-path = "~/.cargo/advisory-db"
db-urls = ["https://github.com/rustsec/advisory-db"]
yanked = "deny"
# NOTE: full rationale for each ignore lives in `.cargo/audit.toml` so
# both tools share one source of truth. Keep this list in lockstep.
ignore = [
    # RUSTSEC-2024-0449 — `unsafe-libyaml` unmaintained warning (no CVE).
    # Reaches us via serde_yaml_ng (serde_yaml is explicitly banned
    # above). Operator-controlled YAML parsed only at process start
    # — no request-path attacker input. See `.cargo/audit.toml` for
    # the full write-up and the next-review date.
    "RUSTSEC-2024-0449",
]

[licenses]
version = 2
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "MIT",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-DFS-2016",
    "Unicode-3.0",
    "Zlib",
    "CC0-1.0",
    "CDLA-Permissive-2.0",
    "MPL-2.0",
    "OpenSSL",
]
confidence-threshold = 0.9

[[licenses.clarify]]
name = "ring"
version = "*"
expression = "MIT AND ISC AND OpenSSL"
license-files = [
    { path = "LICENSE", hash = 0xbd0eed23 },
]

[bans]
multiple-versions = "warn"
wildcards = "deny"
highlight = "all"
deny = [
    { name = "openssl" },
    { name = "openssl-sys" },
    { name = "serde_yaml" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
