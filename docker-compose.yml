services:
  resql:
    image: turnerrainer/resql:0.1.1-alpha
    container_name: resql
    restart: unless-stopped
    ports:
      - "8080:8080"
    # Override any of these to point at live datasources. The image ships
    # with a self-contained SQLite demo (two datasources: `users` + `audit`)
    # so `docker compose up` works with no further setup.
    # environment:
    #   RESQL_LOG: "info,resql=debug"
    # volumes:
    #   - ./resql.yaml:/app/resql.yaml:ro
    #   - ./sql:/app/sql:ro
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8080/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    # Immutable rootfs: the container can only write to explicitly-mounted
    # volumes. Combined with `no-new-privileges` and `cap_drop:ALL`, this
    # closes the FN4 finding — an RCE in the resql process cannot drop a
    # payload anywhere on the container's filesystem. If you use
    # file-backed SQLite instead of the in-memory demo, mount the data
    # directory explicitly (writable) so SQLite still has somewhere to
    # write WAL / journal files, e.g.:
    #   volumes:
    #     - ./sqlite-data:/var/lib/resql/data
    # and point your `resql.yaml` datasource URL at
    # `sqlite:/var/lib/resql/data/resql.db`.
    read_only: true
    tmpfs:
      # Writable scratch for /tmp (matches the compose defaults so
      # everything Rust's default temp-file APIs need still works).
      - /tmp:size=64M
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 512M
        reservations:
          cpus: "0.25"
          memory: 128M
