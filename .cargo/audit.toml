# cargo-audit configuration.
#
# `ignore` entries are documented one-per-line with a rationale that a
# next maintainer can re-check. The default posture is deny-warnings —
# every advisory is a build failure unless explicitly excused below.

[advisories]
ignore = [
    # RUSTSEC-2023-0071 — Marvin timing side-channel in the `rsa` crate.
    # `rsa` is pulled into Cargo.lock via sqlx-mysql (optional dep of
    # sqlx-macros-core), but Resql does NOT enable the mysql
    # backend and sqlx-mysql is not compiled into the released binary
    # (verified via `cargo build --release` — only sqlx-core, sqlx-postgres,
    # sqlx-sqlite show up). No runtime attack surface. Re-audit if the
    # mysql backend is ever enabled (see tasks/backlog/005-mysql-driver-optional.md).
    #
    # Last verified 2026-09-18: `cargo tree --all-features --target
    # x86_64-unknown-linux-gnu -i rsa` still reports "nothing to print"
    # — rsa is unreachable through the enabled feature set. No upstream
    # fix released for rsa 0.9.x as of this date. Next review 2026-12-18.
    "RUSTSEC-2023-0071",

    # RUSTSEC-2026-0235 — rkyv archive validation OOB read on Rc/Arc.
    # `rkyv` 0.7.46 is a transitive of `rust_decimal 1.42.1` (via
    # rust_decimal's default features), itself pulled in by our
    # `sqlx = { features = [..., "rust_decimal"] }`. The vulnerability
    # requires deserialising untrusted rkyv-serialised archives — a
    # code path Resql never exercises at runtime. `cargo tree -i rkyv`
    # reports nothing (rkyv symbols are optimised out when the
    # rust_decimal rkyv feature isn't used).
    #
    # Last verified 2026-09-18:
    #  - `cargo tree --all-features -i rkyv` reports nothing — rkyv is
    #    optimised out of the enabled feature set even under full
    #    features. Runtime attack surface is nil.
    #  - rust_decimal 1.43.0 (published 2026-09-02) moved the rkyv
    #    dependency from an optional non-dev dep to a dev-only dep.
    #    Upgrading rust_decimal is a viable path to dropping rkyv 0.7
    #    from the lockfile entirely — tracked separately so this
    #    security ignore isn't blocked on a dep bump.
    # Next review 2026-12-18.
    "RUSTSEC-2026-0235",

    # RUSTSEC-2024-0449 — `unsafe-libyaml` unmaintained warning (no CVE).
    # `unsafe-libyaml 0.2.11` is a transitive of `serde_yaml_ng 0.10.0`,
    # our YAML parser for `resql.yaml` and the YAML front-matter on
    # `.sql` files. The original `serde_yaml` is explicitly banned in
    # `deny.toml` (upstream unmaintained first), and `serde_yaml_ng` is
    # the chosen fork; it still depends on `unsafe-libyaml` and upstream
    # has not switched parsers. `serde_yml` is also deprecated.
    # Alternative Rust YAML crates (noyalib, fyaml) are either very
    # early (noyalib 0.0.x, pure-Rust but immature) or C-FFI (fyaml →
    # libfyaml). Switching parsers is a wider migration tracked
    # separately; this ignore is scoped to the audit gate.
    #
    # Runtime exposure: YAML parsing happens only at process start
    # against operator-controlled inputs (`resql.yaml`, SQL
    # front-matter under `sql_dir`). No request-path attacker data
    # ever reaches `unsafe-libyaml`. An operator who supplies a
    # malicious YAML file at startup can already configure any option
    # (plaintext `password:`, header-route allowlists, etc.) — the
    # attack surface does not require a parser bug.
    #
    # Last verified 2026-10-14:
    #  - `cargo tree -i unsafe-libyaml --target all` reports a single
    #    path: unsafe-libyaml 0.2.11 → serde_yaml_ng 0.10.0 → resql.
    #  - `cargo search serde_yaml_ng` still shows 0.10.0 as the latest
    #    release; no upstream migration yet.
    # Next review 2026-12-18 (bump if serde_yaml_ng ships a parser
    # swap, or if a RUSTSEC CVE lands against unsafe-libyaml).
    "RUSTSEC-2024-0449",
]

[output]
deny = ["warnings"]
quiet = false
