name: docs

on:
  push:
    branches: [main, dev]
  workflow_dispatch:

concurrency:
  group: "pages-${{ github.ref }}"
  cancel-in-progress: false

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install mdBook (pinned)
        run: |
          MDBOOK_VERSION=0.4.40
          LINKCHECK_VERSION=0.7.7
          mkdir -p ~/.local/bin
          curl -sSL "https://github.com/rust-lang/mdBook/releases/download/v${MDBOOK_VERSION}/mdbook-v${MDBOOK_VERSION}-x86_64-unknown-linux-gnu.tar.gz" \
            | tar -xz -C ~/.local/bin
          curl -sSL "https://github.com/Michael-F-Bryan/mdbook-linkcheck/releases/download/v${LINKCHECK_VERSION}/mdbook-linkcheck.x86_64-unknown-linux-gnu.zip" \
            -o /tmp/linkcheck.zip
          unzip -q /tmp/linkcheck.zip -d ~/.local/bin
          chmod +x ~/.local/bin/mdbook-linkcheck
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Sync CHANGELOG.md → book/src/reference/changelog.md
        run: cp CHANGELOG.md book/src/reference/changelog.md

      - name: mdbook build
        run: mdbook build book

      - uses: actions/upload-pages-artifact@v3
        with:
          path: book/book/html

  deploy:
    needs: build
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/dev'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
