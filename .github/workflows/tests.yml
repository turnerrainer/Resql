name: tests

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  build-test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm]
    runs-on: ${{ matrix.os }}
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: cipw
          POSTGRES_DB: resql_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    env:
      TEST_POSTGRES_URL: "postgres://postgres:cipw@localhost:5432/resql_test"
    steps:
      - uses: actions/checkout@v5

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.88.0
          components: rustfmt, clippy

      - name: Cache cargo registry + build
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-${{ runner.arch }}-cargo-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-cargo-

      - name: Apply schema + fixtures via Liquibase
        run: |
          docker run --rm --network host \
            -v "${GITHUB_WORKSPACE}/db/changelog:/liquibase/changelog" \
            liquibase/liquibase:4.29 \
            --url=jdbc:postgresql://localhost:5432/resql_test \
            --username=postgres --password=cipw \
            --changeLogFile=changelog/master.yaml \
            --contexts=test \
            update

      - name: cargo fmt --check
        run: cargo fmt --all -- --check

      - name: cargo clippy -D warnings
        run: cargo clippy --all-targets --locked -- -D warnings

      - name: cargo build --release
        run: cargo build --release --locked --bin resql

      - name: cargo test --no-fail-fast
        run: cargo test --no-fail-fast --locked

  docs-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install mdBook (pinned)
        run: |
          MDBOOK_VERSION=0.4.40
          LINKCHECK_VERSION=0.7.7
          mkdir -p ~/.local/bin
          curl -sSL "https://github.com/rust-lang/mdBook/releases/download/v${MDBOOK_VERSION}/mdbook-v${MDBOOK_VERSION}-x86_64-unknown-linux-gnu.tar.gz" \
            | tar -xz -C ~/.local/bin
          curl -sSL "https://github.com/Michael-F-Bryan/mdbook-linkcheck/releases/download/v${LINKCHECK_VERSION}/mdbook-linkcheck.x86_64-unknown-linux-gnu.zip" \
            -o /tmp/linkcheck.zip
          unzip -q /tmp/linkcheck.zip -d ~/.local/bin
          chmod +x ~/.local/bin/mdbook-linkcheck
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Sync CHANGELOG.md → book/src/reference/changelog.md
        run: cp CHANGELOG.md book/src/reference/changelog.md

      - name: mdbook build (with linkcheck)
        run: mdbook build book
