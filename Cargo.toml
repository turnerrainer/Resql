[package]
name = "resql"
version = "0.5.1-alpha"
edition = "2021"
rust-version = "1.88"
license = "Apache-2.0"
description = "SQL-files-as-REST-endpoints microservice (Rust rewrite of Buerostack Resql)"
repository = "https://github.com/turnerrainer/Resql"
readme = "README.md"

[[bin]]
name = "resql"
path = "src/main.rs"

[lib]
name = "resql"
path = "src/lib.rs"

[dependencies]
anyhow = "1.0"
axum = { version = "0.7", default-features = false, features = ["http1", "json", "matched-path", "tokio", "query"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
clap = { version = "4.5", default-features = false, features = ["std", "derive", "env", "help", "usage", "error-context"] }
futures-util = { version = "0.3", default-features = false }
uuid = { version = "1.10", features = ["v4", "serde"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["preserve_order"] }
serde_yaml_ng = "0.10"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio-rustls", "postgres", "sqlite", "mysql", "json", "chrono", "uuid", "rust_decimal"] }
thiserror = "2.0"
time = { version = "0.3", default-features = false, features = ["formatting", "macros", "std"] }
tokio = { version = "1.40", features = ["macros", "rt-multi-thread", "signal", "sync", "time"] }
tower = { version = "0.5", default-features = false, features = ["util"] }
tower-http = { version = "0.6", default-features = false, features = ["cors", "limit", "timeout"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["env-filter", "fmt", "json"] }
# Optional OTLP trace export, enabled at runtime by OTEL_EXPORTER_OTLP_ENDPOINT.
# tonic is built without TLS (keeps rustls-pemfile out of the tree); TLS
# endpoints use OTLP/HTTP through reqwest + rustls.
opentelemetry = { version = "0.27", default-features = false, features = ["trace", "internal-logs"] }
opentelemetry_sdk = { version = "0.27", default-features = false, features = ["trace", "rt-tokio", "internal-logs"] }
opentelemetry-otlp = { version = "0.27", default-features = false, features = ["trace", "grpc-tonic", "http-proto", "reqwest-client", "internal-logs"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
tracing-opentelemetry = { version = "0.28", default-features = false }

[dev-dependencies]
axum = { version = "0.7", default-features = false, features = ["http1", "json", "matched-path", "tokio", "query"] }
http-body-util = "0.1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
tempfile = "3.10"
tokio = { version = "1.40", features = ["macros", "rt-multi-thread", "signal", "test-util", "time"] }
tower = { version = "0.5", default-features = false, features = ["util"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
