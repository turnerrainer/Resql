# Resql default configuration
#
# Every field shown here is documented in book/src/configuration.md. Env
# vars follow the pattern RESQL__<UPPERCASE_KEY> with `__` for nesting.
# Passwords are NEVER stored in this file — point at env var names via
# `password_env`.
#
# The shipped configuration wires up TWO SQLite-in-memory datasources
# (`users` and `audit`) to demonstrate multi-database routing out of the
# box. `POST /users/echo` and `POST /audit/write` route to different
# backends by URL segment; add an `X-Datasource: <name>` header to
# override.

server:
  # Bind address and port for the HTTP listener.
  bind: "0.0.0.0:8080"
  # Max inbound JSON body size (bytes). Enforced by tower-http RequestBodyLimit.
  # Overflow returns 413.
  max_body_bytes: 1048576
  # Per-request wall-clock timeout (seconds). 0 disables.
  request_timeout_seconds: 30

# Directory to scan for SQL files.
# Layout: sql_dir/<project>/<GET|POST>/<path...>.sql
# → endpoint <METHOD> /<project>/<path...>/<filename-without-.sql>
sql_dir: "./sql"

# Optional: map URL project segment to a datasource NAME. If a project is
# absent from this map, the datasource with the same name as the project
# is used. If neither exists at request time, the response is 400 with
# UnknownDataSourceName.
project_datasource_map: {}

# Optional: allow per-request datasource override via the X-Datasource
# header. When false the header is ignored.
allow_datasource_header: true

datasources:
  # Primary backend for the `users` URL project. SQLite in-memory in the
  # shipped image; replace with a real Postgres URL in production.
  - name: users
    url: "sqlite::memory:"
    username: ""
    password_env: ""
    max_connections: 10
    acquire_timeout_seconds: 5

  # Second backend for the `audit` URL project. Proves multi-database
  # routing on the demo image — each project talks to a different pool.
  - name: audit
    url: "sqlite::memory:"
    username: ""
    password_env: ""
    max_connections: 5
    acquire_timeout_seconds: 5

cors:
  # "*" allows any origin. Comma-separated list of exact origins otherwise.
  allowed_origins: "*"

logging:
  # tracing_subscriber EnvFilter directive. Overridable via RESQL_LOG env.
  level: "info,resql=debug"
  # "text" (default) or "json".
  format: "text"
