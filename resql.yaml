# Resql default configuration
#
# Every field shown here is documented in book/src/configuration.md. Env
# vars follow the pattern RESQL__<UPPERCASE_KEY> with `__` for nesting.
# Passwords are NEVER stored in this file — point at env var names via
# `password_env`.
#
# The shipped configuration wires up TWO SQLite-in-memory datasources
# (`users` and `audit`) to demonstrate multi-database routing out of the
# box. `POST /users/echo` and `POST /audit/write` route to different
# backends by URL segment.
#
# **This file matches the code-level SAFE DEFAULTS.** If you were
# reading the shipped file before v0.3.1-alpha it enabled two lanes
# — `allow_datasource_header: true` and `cors.allowed_origins: "*"` —
# that contradicted the CHANGELOG's "closed by default" posture. If a
# specific deployment needs either lane, uncomment the field and set
# the value explicitly; the code will WARN loudly at boot when either
# knob is turned on for a non-loopback bind.

server:
  # Bind address and port for the HTTP listener.
  bind: "0.0.0.0:8080"
  # Max inbound JSON body size (bytes). Enforced by tower-http RequestBodyLimit.
  # Overflow returns 413 with the same header-envelope shape as any other error.
  max_body_bytes: 1048576
  # Per-request wall-clock timeout (seconds). Must be > 0; boot refuses 0.
  request_timeout_seconds: 30

# Directory to scan for SQL files.
# Layout: sql_dir/<project>/<GET|POST>/<path...>.sql
# → endpoint <METHOD> /<project>/<path...>/<filename-without-.sql>
sql_dir: "./sql"

# Optional: map URL project segment to a datasource NAME. If a project is
# absent from this map, the datasource with the same name as the project
# is used. If neither exists at request time, the response is 400 with
# UnknownDataSourceName.
project_datasource_map: {}

# Header-driven datasource routing is DISABLED by default (lateral-move
# lane inside the trust boundary). Enable per-deployment only when you
# need it, and always alongside a `datasource_header_allowlist` — every
# override that isn't allow-listed returns 403.
#
# allow_datasource_header: true
# datasource_header_allowlist:
#   users: [users, users_replica]
#   audit: [audit]

datasources:
  # Primary backend for the `users` URL project. SQLite in-memory in the
  # shipped image; replace with a real Postgres URL in production.
  - name: users
    url: "sqlite::memory:"
    username: ""
    password_env: ""
    max_connections: 10
    acquire_timeout_seconds: 5

  # Second backend for the `audit` URL project. Proves multi-database
  # routing on the demo image — each project talks to a different pool.
  - name: audit
    url: "sqlite::memory:"
    username: ""
    password_env: ""
    max_connections: 5
    acquire_timeout_seconds: 5

cors:
  # Empty (default) = no CORS layer attached — browsers refuse cross-origin
  # reads, which is what you want for a service that sits behind a reverse
  # proxy. Set to a comma-separated allowlist of exact origins for
  # browser-facing deployments (e.g. "https://app.example.com"). The
  # wildcard "*" is still supported but the boot log WARNs loudly because
  # it opens every origin — never appropriate for a service that returns
  # per-user data.
  allowed_origins: ""

# ─── security (fleet §3.1 boot-refuse + F-RES-3 bearer gate) ────────────────
# The shipped image binds `0.0.0.0:8080` so `docker compose up` works
# out-of-the-box. Boot would normally REFUSE that combination (fleet §3.1)
# because a non-loopback bind without an authentication story is one HTTP
# request away from unauth SQL execution. `trust_network: true` opts out
# of that check — it is a **promise** that a reverse proxy (Ruuter in
# Bürokratt, nginx / Traefik / Envoy elsewhere) authenticates every
# request BEFORE it reaches Resql.
#
# For a real production deployment you should either:
#   1. Leave this line and put an authenticating proxy in front, OR
#   2. Delete this line and set `inter_service_token_env` below to
#      enable the built-in bearer gate, OR
#   3. Delete this line and change `server.bind` to `127.0.0.1:8080` /
#      `[::1]:8080` / `localhost:8080` (loopback → check auto-satisfied).
#
# The shipped demo image (SQLite in-memory, no persisted data) is a
# `trust_network: true` deployment by design — it exists to let you
# poke at the API from your host without further setup, not to serve
# production traffic.
security:
  trust_network: true
  # inter_service_token_env: RESQL_INTER_SERVICE_TOKEN

logging:
  # tracing_subscriber EnvFilter directive. Overridable via RESQL_LOG env.
  level: "info,resql=debug"
  # "text" (default) or "json".
  format: "text"
